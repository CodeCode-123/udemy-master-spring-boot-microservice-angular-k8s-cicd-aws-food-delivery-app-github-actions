# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: Clean workspace
      if: always()
      run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Remove .git directory
      run: rm -rf .git
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Install Dependencies 
      run: npm ci
    - name: Build Project
      run: npm run build --if-present
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: codecode123/food-delivery-app-fe-arm-cicd-github-actions
        tags: |
          type=sha
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Update image tag in manifest
      working-directory: ../../../../../deployment
      env:
        NEW_TAG: ${{ steps.meta.outputs.tags }}
      run: |
        yq eval '(select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "angular-app-container") | .image) = env(NEW_TAG)' -i angular-manifest.yaml
    - name: Commit and push changes
      working-directory: ../../../../../deployment
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add angular-manifest.yaml
        git diff --staged --quiet || git commit -m "chore: update image tag to ${{ steps.meta.outputs.tags }}"
        git push --set-upstream origin main


    
